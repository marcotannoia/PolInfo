services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5001
    depends_on:
      - backend

  db:
    image: mongo:latest

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
